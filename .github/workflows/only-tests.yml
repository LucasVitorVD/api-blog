name: CI pipeline

on:
  push:
    branches-ignore:
      - main
      - master

jobs:
  run-all-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Setup maven
        uses: stCarolas/setup-maven@4.4
        with:
          maven-version: 3.8.2

      - name: Build and test with Maven
        run: mvn clean install